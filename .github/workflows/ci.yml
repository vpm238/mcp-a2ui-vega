name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the catalog
        run: npm run build -w @mcp-a2ui-vega/catalog

      - name: Dataset and CSV tests
        run: node --test tools/*.test.mjs

      - name: Typecheck the renderer
        run: npm run build -w @mcp-a2ui-vega/renderer

      - name: Typecheck the server
        run: |
          npm run build:app -w @mcp-a2ui-vega/renderer
          npm run assets -w @mcp-a2ui-vega/server
          npx --workspace @mcp-a2ui-vega/server tsc --noEmit
