name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      # Without this the deploy fails deep inside wrangler with "kv_namespaces[0]
      # should have a string id" — true, but not the useful sentence. Say the
      # useful sentence, and skip rather than fail: a repository nobody has given
      # Cloudflare credentials to is not broken, it is just not deployed yet.
      - name: Check for Cloudflare credentials
        id: guard
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::warning title=Worker not deployed::Add these repository secrets to deploy:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.ready == 'true'

      # The catalog document, the single-file app and the seed CSV are all
      # bundled into the Worker, so the build has to run before the deploy.
      - name: Build
        if: steps.guard.outputs.ready == 'true'
        run: |
          npm run build -w @mcp-a2ui-vega/catalog
          npm run build:app -w @mcp-a2ui-vega/renderer
          npm run assets -w @mcp-a2ui-vega/server

      # Finds the namespace, or creates it on the first deploy, and writes its
      # id into wrangler.toml. A namespace id is not a secret, so there is no
      # reason to make somebody copy one around by hand.
      - name: Make sure the KV namespace exists
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional: point at a namespace this project did not create.
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: npm run setup:kv -w @mcp-a2ui-vega/server

      - id: worker
        uses: cloudflare/wrangler-action@v3
        if: steps.guard.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/server

      # The URL is the one thing you need after a deploy, and hunting for it in
      # wrangler's output is a chore. Put it on the run's summary page.
      - name: Say where it went
        if: steps.guard.outputs.ready == 'true'
        env:
          URL: ${{ steps.worker.outputs.deployment-url }}
        run: |
          {
            echo "## Deployed"
            echo
            if [ -n "$URL" ]; then
              echo "Add this to Claude as a custom connector:"
              echo
              echo '```'
              echo "$URL/mcp"
              echo '```'
              echo
              echo "- The dashboard on its own: $URL/app.html?server=$URL"
              echo "- Health check: $URL/health"
            else
              echo "Wrangler did not report a URL — check the deploy step's log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The standalone demo: the same bundle, running against the committed CSV
      # with no server at all.
      - name: Build the site
        run: |
          npm run build -w @mcp-a2ui-vega/catalog
          npm run build -w @mcp-a2ui-vega/renderer
          cp packages/catalog/dist/catalog.json packages/renderer/dist/site/catalog.json

      # Enabling Pages needs a permission the workflow token does not have, so
      # this is a one-time click in Settings. Until then, say so and stay green
      # rather than failing every push over a demo page.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain why the demo was not published
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Demo not published::Enable Pages under Settings → Pages with source 'GitHub Actions', then re-run this workflow."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: packages/renderer/dist/site

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
